services:
  log-generator:
    build: ./generator
    container_name: log-generator
    environment:
      - LOGSTASH_HOST=${LOGSTASH_HOST:-host.docker.internal}
      - LOGSTASH_PORT=${LOGSTASH_PORT:-8091}
      - LOG_INTERVAL=${LOG_INTERVAL:-3}
      - SERVICE_NAME=${SERVICE_NAME:-demo-app}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: "http://10.0.2.56:3100/loki/api/v1/push"
        loki-external-labels: "container_name={{.Name}}"