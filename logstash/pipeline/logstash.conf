input {
  # The generator sends newline-delimited JSON here.
  tcp {
    port  => 8091
    codec => json_lines
  }
}

filter {
  mutate {
    add_field => { "[@metadata][target_index]" => "app-logs-%{+YYYY.MM.dd}" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
  }

  # Also persist raw lines on disk (mounted to ./logs on the host).
  file {
    path => "/usr/share/logstash/output/app-logs-%{+YYYY.MM.dd}.log"
  }

  stdout { codec => rubydebug }
}
